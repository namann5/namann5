<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="495" height="195" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="495" height="195" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">
    <tspan>&#128279;</tspan> GitHub Stats — namann5
  </text>
  <line x1="16" y1="36" x2="479" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Rank Ring -->
  <g transform="translate(60, 100)">
    <!-- Ring background -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#30363d" stroke-width="6"/>
    <!-- Ring progress (Top 5% = ~95% fill, animates) -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="6"
            stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="238.76" to="11.94" dur="1.5s" fill="freeze" begin="0.3s"/>
    </circle>
    <!-- Rank text -->
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#c9d1d9" opacity="0">
      Top 5%
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.2s"/>
    </text>
    <text x="0" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#8b949e" opacity="0">
      RANK
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.2s"/>
    </text>
  </g>

  <!-- Stat rows -->
  <!-- Row 1: Total Stars -->
  <g opacity="0" transform="translate(-30, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" from="-30,0" to="0,0" dur="0.4s" fill="freeze" begin="0.5s"/>
    <!-- Progress bar background -->
    <rect x="120" y="50" width="350" height="6" rx="3" fill="#30363d" opacity="0.5"/>
    <!-- Progress bar fill -->
    <rect x="120" y="50" width="0" height="6" rx="3" fill="url(#purpleGrad)">
      <animate attributeName="width" from="0" to="315" dur="0.8s" fill="freeze" begin="0.9s"/>
    </rect>
    <!-- Star icon -->
    <text x="120" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#8B5CF6">&#9733;</text>
    <!-- Label -->
    <text x="140" y="69" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Total Stars</text>
    <!-- Value -->
    <text x="460" y="69" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">25+</text>
  </g>

  <!-- Row 2: Total Commits -->
  <g opacity="0" transform="translate(-30, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="0.7s"/>
    <animateTransform attributeName="transform" type="translate" from="-30,0" to="0,0" dur="0.4s" fill="freeze" begin="0.7s"/>
    <rect x="120" y="76" width="350" height="6" rx="3" fill="#30363d" opacity="0.5"/>
    <rect x="120" y="76" width="0" height="6" rx="3" fill="url(#purpleGrad)">
      <animate attributeName="width" from="0" to="280" dur="0.8s" fill="freeze" begin="1.1s"/>
    </rect>
    <text x="120" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#8B5CF6">&#9679;</text>
    <text x="140" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Total Commits</text>
    <text x="460" y="95" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">500+</text>
  </g>

  <!-- Row 3: PRs Merged -->
  <g opacity="0" transform="translate(-30, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="0.9s"/>
    <animateTransform attributeName="transform" type="translate" from="-30,0" to="0,0" dur="0.4s" fill="freeze" begin="0.9s"/>
    <rect x="120" y="102" width="350" height="6" rx="3" fill="#30363d" opacity="0.5"/>
    <rect x="120" y="102" width="0" height="6" rx="3" fill="url(#purpleGrad)">
      <animate attributeName="width" from="0" to="175" dur="0.8s" fill="freeze" begin="1.3s"/>
    </rect>
    <text x="120" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#8B5CF6">&#10003;</text>
    <text x="140" y="121" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">PRs Merged</text>
    <text x="460" y="121" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">10+</text>
  </g>

  <!-- Row 4: Issues Opened -->
  <g opacity="0" transform="translate(-30, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.1s"/>
    <animateTransform attributeName="transform" type="translate" from="-30,0" to="0,0" dur="0.4s" fill="freeze" begin="1.1s"/>
    <rect x="120" y="128" width="350" height="6" rx="3" fill="#30363d" opacity="0.5"/>
    <rect x="120" y="128" width="0" height="6" rx="3" fill="url(#purpleGrad)">
      <animate attributeName="width" from="0" to="210" dur="0.8s" fill="freeze" begin="1.5s"/>
    </rect>
    <text x="120" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#8B5CF6">&#9675;</text>
    <text x="140" y="147" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Issues Opened</text>
    <text x="460" y="147" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">15+</text>
  </g>

  <!-- Row 5: Contributions -->
  <g opacity="0" transform="translate(-30, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.3s"/>
    <animateTransform attributeName="transform" type="translate" from="-30,0" to="0,0" dur="0.4s" fill="freeze" begin="1.3s"/>
    <rect x="120" y="154" width="350" height="6" rx="3" fill="#30363d" opacity="0.5"/>
    <rect x="120" y="154" width="0" height="6" rx="3" fill="url(#purpleGrad)">
      <animate attributeName="width" from="0" to="350" dur="0.8s" fill="freeze" begin="1.7s"/>
    </rect>
    <text x="120" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#8B5CF6">&#9612;</text>
    <text x="140" y="173" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Contributions</text>
    <text x="460" y="173" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">500+</text>
  </g>

</svg>