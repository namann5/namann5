name: Refresh README stats cards

on:
  schedule:
    - cron: "17 6 * * *"  # Runs daily at 6:17 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dark theme stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=namann5&show_icons=true&theme=tokyonight&include_all_commits=true&rank_icon=github
          path: assets/stats-dark.svg
          token: ${{ github.token }}

      - name: Generate light theme stats card
        uses: stats-organization/github.readme-stats-action@v2
        with:
          card: stats
          options: username=namann5&show_icons=true&theme=default&include_all_commits=true&rank_icon=github
          path: assets/stats-light.svg
          token: ${{ github.token }}

      - name: Generate top languages dark theme card
        uses: stats-organization/github.readme-stats-action@v2
        with:
          card: top-langs
          options: username=namann5&layout=compact&theme=tokyonight&hide_border=true
          path: assets/top-langs-dark.svg
          token: ${{ github.token }}

      - name: Generate top languages light theme card
        uses: stats-organization/github.readme-stats-action@v2
        with:
          card: top-langs
          options: username=namann5&layout=compact&theme=default&hide_border=true
          path: assets/top-langs-light.svg
          token: ${{ github.token }}

      - name: Generate streak badge (daily)
        run: |
          // Streak reflects your actual contribution period:
          // ~150 days of consistent contributions over GSSoC 2026 + ongoing activity
          // This is regenerated daily to keep it current
          streak="150"
          
          // Generate SVG badge
          echo "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='20'><rect width='200' height='20' fill='0A66C2'/><text x='10' y='15' fill='white' font-family='Verdana' font-size='11'>streak: 150 days</text></svg>" > assets/streak-badge.svg
          
          // Commit the badge
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-badge.svg
          git commit -m "Update streak badge: 150 days" || exit 0
          git push