name: Refresh README stats cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dark theme stats SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          username: namann5
          theme: tokyonight
          show_icons: true
          include_all_commits: true
          rank_icon: github
          output: assets/stats-dark.svg

      - name: Generate light theme stats SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          username: namann5
          theme: default
          show_icons: true
          include_all_commits: true
          rank_icon: github
          output: assets/stats-light.svg

      - name: Generate top languages dark theme SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          username: namann5
          layout: compact
          theme: tokyonight
          hide_border: true
          output: assets/top-langs-dark.svg

      - name: Generate top languages light theme SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          username: namann5
          layout: compact
          theme: default
          hide_border: true
          output: assets/top-langs-light.svg
