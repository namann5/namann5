name: Refresh README stats cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dark theme stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=namann5&show_icons=true&theme=tokyonight&include_all_commits=true&rank_icon=github
          path: assets/stats-dark.svg
          token: ${{ github.token }}

      - name: Generate light theme stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=namann5&show_icons=true&theme=default&include_all_commits=true&rank_icon=github
          path: assets/stats-light.svg
          token: ${{ github.token }}

      - name: Generate top languages dark theme card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=namann5&layout=compact&theme=tokyonight&hide_border=true
          path: assets/top-langs-dark.svg
          token: ${{ github.token }}

      - name: Generate top languages light theme card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=namann5&layout=compact&theme=default&hide_border=true
          path: assets/top-langs-light.svg
          token: ${{ github.token }}
