<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E4E2"/>
      <stop offset="100%" stop-color="#B0B0B0"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B572A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="32" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600">Achievements</text>

  <!-- Row 1: 4 trophies -->
  <!-- T1: Pull Shark Gold -->
  <g transform="translate(100,60)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#FFD700" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Pull Shark</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Gold</text>
  </g>

  <!-- T2: YOLO Silver -->
  <g transform="translate(300,60)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">YOLO</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Silver</text>
  </g>

  <!-- T3: Arctic Vault Platinum -->
  <g transform="translate(500,60)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#E5E4E2" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Arctic Vault</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Platinum</text>
  </g>

  <!-- T4: Quickdraw Bronze -->
  <g transform="translate(700,60)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Quickdraw</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Bronze</text>
  </g>

  <!-- Row 2: 3 trophies -->
  <!-- T5: Starstruck Gold -->
  <g transform="translate(200,185)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#FFD700" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Starstruck</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Gold</text>
  </g>

  <!-- T6: Galaxy Brain Silver -->
  <g transform="translate(400,185)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Galaxy Brain</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Silver</text>
  </g>

  <!-- T7: Pair Extraordinaire Bronze -->
  <g transform="translate(600,185)">
    <text x="0" y="30" font-size="40" text-anchor="middle">&#127942;</text>
    <text x="0" y="60" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Pair Extra.</text>
    <text x="0" y="75" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Bronze</text>
  </g>

  <rect x="20" y="285" width="760" height="1" fill="#30363d" opacity="0.5"/>
  <text x="400" y="298" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">namann5</text>
</svg>
