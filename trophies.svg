<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <style type="text/css"><![CDATA[
    .trophy { opacity: 0; animation: popIn 0.5s ease-out forwards; }
    .t1 { animation-delay: 0.2s; }
    .t2 { animation-delay: 0.4s; }
    .t3 { animation-delay: 0.6s; }
    .t4 { animation-delay: 0.8s; }
    .t5 { animation-delay: 1.0s; }
    .t6 { animation-delay: 1.2s; }
    .t7 { animation-delay: 1.4s; }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }
  ]]></style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E4E2"/>
      <stop offset="100%" stop-color="#B0B0B0"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B572A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="35" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600">Achievements</text>

  <!-- ROW 1 -->
  <g class="trophy t1" transform="translate(100, 65)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#gold)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#FFD700" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Pull Shark</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Gold</text>
  </g>

  <g class="trophy t2" transform="translate(300, 65)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#silver)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">YOLO</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Silver</text>
  </g>

  <g class="trophy t3" transform="translate(500, 65)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#platinum)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#E5E4E2" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Arctic Vault</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Platinum</text>
  </g>

  <g class="trophy t4" transform="translate(700, 65)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#bronze)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Quickdraw</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Bronze</text>
  </g>

  <!-- ROW 2 -->
  <g class="trophy t5" transform="translate(200, 195)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#gold)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#FFD700" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Starstruck</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Gold</text>
  </g>

  <g class="trophy t6" transform="translate(400, 195)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#silver)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Galaxy Brain</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Silver</text>
  </g>

  <g class="trophy t7" transform="translate(600, 195)">
    <text x="0" y="20" font-size="36" text-anchor="middle" fill="url(#bronze)">&#127942;</text>
    <text x="0" y="55" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Pair Extra.</text>
    <text x="0" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Bronze</text>
  </g>

  <rect x="20" y="300" width="760" height="1" fill="#30363d" opacity="0.5"/>
  <text x="400" y="316" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">namann5</text>
</svg>
