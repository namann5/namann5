<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <style type="text/css"><![CDATA[
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shine {
      0% { transform: translateX(-8px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateX(80px); opacity: 0; }
    }
    .trophy { opacity: 0; animation: popIn 0.5s ease-out forwards; }
    .t1 { animation-delay: 0.2s; }
    .t2 { animation-delay: 0.4s; }
    .t3 { animation-delay: 0.6s; }
    .t4 { animation-delay: 0.8s; }
    .t5 { animation-delay: 1.0s; }
    .t6 { animation-delay: 1.2s; }
    .t7 { animation-delay: 1.4s; }
    .shine1 { animation: shine 0.4s ease-out 0.6s forwards; }
    .shine2 { animation: shine 0.4s ease-out 0.8s forwards; }
    .shine3 { animation: shine 0.4s ease-out 1.0s forwards; }
    .shine4 { animation: shine 0.4s ease-out 1.2s forwards; }
    .shine5 { animation: shine 0.4s ease-out 1.4s forwards; }
    .shine6 { animation: shine 0.4s ease-out 1.6s forwards; }
    .shine7 { animation: shine 0.4s ease-out 1.8s forwards; }
  ]]></style>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
    <linearGradient id="platinumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E4E2"/>
      <stop offset="100%" stop-color="#B0B0B0"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B572A"/>
    </linearGradient>
    <clipPath id="rounded-bg">
      <rect x="0" y="0" width="600" height="300" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-bg)">
    <rect x="0" y="0" width="600" height="300" fill="url(#bg-grad)"/>
    <rect x="0.5" y="0.5" width="599" height="299" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
  </g>

  <text x="300" y="30" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Achievements</text>

  <!-- ROW 1: 4 Trophies — evenly spaced at x = 75, 225, 375, 525 -->

  <!-- Trophy 1: Pull Shark (Gold) -->
  <g class="trophy t1" transform="translate(75, 55)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#goldGrad)" stroke="#DAA520" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#goldGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#goldGrad)"/>
      <rect class="shine1" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF8DC">&#9733;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#FFD700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Pull Shark</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Gold</text>
  </g>

  <!-- Trophy 2: YOLO (Silver) -->
  <g class="trophy t2" transform="translate(225, 55)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#silverGrad)" stroke="#C0C0C0" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#silverGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#silverGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#silverGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#silverGrad)"/>
      <rect class="shine2" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF">&#9889;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">YOLO</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Silver</text>
  </g>

  <!-- Trophy 3: Arctic Code Vault (Platinum) -->
  <g class="trophy t3" transform="translate(375, 55)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#platinumGrad)" stroke="#D1D5DB" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#platinumGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#platinumGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#platinumGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#platinumGrad)"/>
      <rect class="shine3" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF">&#10052;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#E5E4E2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Arctic Vault</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Platinum</text>
  </g>

  <!-- Trophy 4: Quickdraw (Bronze) -->
  <g class="trophy t4" transform="translate(525, 55)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#bronzeGrad)" stroke="#A0522D" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#bronzeGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#bronzeGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#bronzeGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#bronzeGrad)"/>
      <rect class="shine4" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF">&#9889;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Quickdraw</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Bronze</text>
  </g>

  <!-- ROW 2: 3 Trophies — evenly spaced at x = 150, 300, 450 -->

  <!-- Trophy 5: Starstruck (Gold) -->
  <g class="trophy t5" transform="translate(150, 170)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#goldGrad)" stroke="#DAA520" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#goldGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#goldGrad)"/>
      <rect class="shine5" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF8DC">&#11088;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#FFD700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Starstruck</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Gold</text>
  </g>

  <!-- Trophy 6: Galaxy Brain (Silver) -->
  <g class="trophy t6" transform="translate(300, 170)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#silverGrad)" stroke="#C0C0C0" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#silverGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#silverGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#silverGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#silverGrad)"/>
      <rect class="shine6" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF">&#129504;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Galaxy Brain</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Silver</text>
  </g>

  <!-- Trophy 7: Pair Extraordinaire (Bronze) -->
  <g class="trophy t7" transform="translate(450, 170)">
    <g transform="translate(30, 0)">
      <path d="M-18,0 L-14,28 C-14,36 14,36 14,28 L18,0 Z" fill="url(#bronzeGrad)" stroke="#A0522D" stroke-width="1"/>
      <path d="M-18,6 C-30,6 -30,22 -18,22" fill="none" stroke="url(#bronzeGrad)" stroke-width="3"/>
      <path d="M18,6 C30,6 30,22 18,22" fill="none" stroke="url(#bronzeGrad)" stroke-width="3"/>
      <rect x="-3" y="36" width="6" height="10" fill="url(#bronzeGrad)"/>
      <rect x="-16" y="46" width="32" height="6" rx="2" fill="url(#bronzeGrad)"/>
      <rect class="shine7" x="-8" y="2" width="6" height="24" rx="3" fill="white" opacity="0"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" fill="#FFF">&#128101;</text>
    </g>
    <text x="30" y="66" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Pair Extra.</text>
    <text x="30" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">Bronze</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="15" y="275" width="570" height="1" fill="#30363d" opacity="0.5"/>
  <text x="300" y="292" text-anchor="middle" fill="#484f58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10">namann5</text>
</svg>
