<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="rounded-bg">
      <rect x="0" y="0" width="495" height="195" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-bg)">
    <rect x="0" y="0" width="495" height="195" fill="url(#bg-grad)"/>
    <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
