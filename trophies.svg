  <text x="247.5" y="24" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">Achievements</text>

  <!-- Trophy 1: Pull Shark (Gold) -->
  <g transform="translate(15, 45)">
    <animateTransform attributeName="transform" type="scale" values="0;1.15;0.95;1" dur="0.5s" begin="0.3s" fill="freeze" additive="sum"/>
    <g transform="translate(0, 0)">
      <g>
        <circle cx="30" cy="18" r="10" fill="#FFD700"/>
        <rect x="20" y="24" width="20" height="16" rx="2" fill="#FFD700"/>
        <polygon points="14,42 46,42 42,38 18,38" fill="#FFD700"/>
        <rect x="10" y="38" width="40" height="6" rx="2" fill="#b8860b"/>
      </g>
      <rect x="-5" y="0" width="10" height="55" fill="white" opacity="0">
