    <text x="30" y="58" text-anchor="middle" fill="#E5E4E2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Platinum</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="6">Arctic Vault</text>
  </g>

  <!-- Trophy 4: Quickdraw (Bronze) -->
  <g class="trophy t4" transform="translate(216, 45)">
    <circle cx="30" cy="18" r="10" fill="#CD7F32"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#CD7F32"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#CD7F32"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#a0522d"/>
    <rect class="shine4" x="-5" y="0" width="10" height="55" fill="white" opacity="0"/>
    <text x="30" y="58" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Bronze</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="7">Quickdraw</text>
  </g>

  <!-- Trophy 5: Starstruck (Gold) -->
  <g class="trophy t5" transform="translate(283, 45)">
    <circle cx="30" cy="18" r="10" fill="#FFD700"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#FFD700"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#FFD700"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#b8860b"/>
    <rect class="shine5" x="-5" y="0" width="10" height="55" fill="white" opacity="0"/>
    <text x="30" y="58" text-anchor="middle" fill="#FFD700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Gold</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="7">Starstruck</text>
  </g>

  <!-- Trophy 6: Galaxy Brain (Silver) -->
  <g class="trophy t6" transform="translate(350, 45)">
    <circle cx="30" cy="18" r="10" fill="#C0C0C0"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#C0C0C0"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#C0C0C0"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#a9a9a9"/>
    <rect class="shine6" x="-5" y="0" width="10" height="55" fill="white" opacity="0"/>
    <text x="30" y="58" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Silver</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="7">Galaxy Brain</text>
  </g>

  <!-- Trophy 7: Pair Extraordinaire (Bronze) -->
  <g class="trophy t7" transform="translate(417, 45)">
    <circle cx="30" cy="18" r="10" fill="#CD7F32"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#CD7F32"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#CD7F32"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#a0522d"/>
    <rect class="shine7" x="-5" y="0" width="10" height="55" fill="white" opacity="0"/>
    <text x="30" y="58" text-anchor="middle" fill="#CD7F32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Bronze</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="6">Pair Extra.</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="10" y="180" width="475" height="1" fill="#30363d" opacity="0.5"/>
  <text x="247.5" y="192" text-anchor="middle" fill="#484f58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9">namann5</text>
</svg>