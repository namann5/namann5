<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <style type="text/css"><![CDATA[
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shine {
      0% { transform: translateX(-5px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateX(65px); opacity: 0; }
    }
    @keyframes titlePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .trophy { opacity: 0; animation: popIn 0.5s ease-out forwards; }
    .t1 { animation-delay: 0.3s; }
    .t2 { animation-delay: 0.6s; }
    .t3 { animation-delay: 0.9s; }
    .t4 { animation-delay: 1.2s; }
    .t5 { animation-delay: 1.5s; }
    .t6 { animation-delay: 1.8s; }
    .t7 { animation-delay: 2.1s; }
    .shine1 { animation: shine 0.4s ease-out 0.9s forwards; }
    .shine2 { animation: shine 0.4s ease-out 1.2s forwards; }
    .shine3 { animation: shine 0.4s ease-out 1.5s forwards; }
    .shine4 { animation: shine 0.4s ease-out 1.8s forwards; }
    .shine5 { animation: shine 0.4s ease-out 2.1s forwards; }
    .shine6 { animation: shine 0.4s ease-out 2.4s forwards; }
    .shine7 { animation: shine 0.4s ease-out 2.7s forwards; }
  ]]></style>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="rounded-bg">
      <rect x="0" y="0" width="495" height="195" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-bg)">
    <rect x="0" y="0" width="495" height="195" fill="url(#bg-grad)"/>
    <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
  </g>

  <text x="247.5" y="24" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">Achievements</text>

  <!-- Trophy 1: Pull Shark (Gold) -->
  <g class="trophy t1" transform="translate(15, 45)">
    <circle cx="30" cy="18" r="10" fill="#FFD700"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#FFD700"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#FFD700"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#b8860b"/>
    <rect class="shine1" x="-5" y="0" width="10" height="55" fill="white" opacity="0"/>
    <text x="30" y="58" text-anchor="middle" fill="#FFD700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Gold</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="7">Pull Shark</text>
  </g>

  <!-- Trophy 2: YOLO (Silver) -->
  <g class="trophy t2" transform="translate(82, 45)">
    <circle cx="30" cy="18" r="10" fill="#C0C0C0"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#C0C0C0"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#C0C0C0"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#a9a9a9"/>
    <rect class="shine2" x="-5" y="0" width="10" height="55" fill="white" opacity="0"/>
    <text x="30" y="58" text-anchor="middle" fill="#C0C0C0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8">Silver</text>
    <text x="30" y="68" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="7">YOLO</text>
  </g>

  <!-- Trophy 3: Arctic Code Vault (Platinum) -->
  <g class="trophy t3" transform="translate(149, 45)">
    <circle cx="30" cy="18" r="10" fill="#E5E4E2"/>
    <rect x="20" y="24" width="20" height="16" rx="2" fill="#E5E4E2"/>
    <polygon points="14,42 46,42 42,38 18,38" fill="#E5E4E2"/>
    <rect x="10" y="38" width="40" height="6" rx="2" fill="#bfbfbf"/>
