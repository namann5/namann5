<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="Schematic of the AnimeVerse request flow: browser to routes to data layer with AniList GraphQL, streaming API and Firebase, with numbered callouts.">
