    <line x1="20" y1="384" x2="700" y2="384" stroke="#c5d3e3" stroke-width="1"/>
    <text x="20" y="410" font-size="20" letter-spacing="1.6" fill="#7f93a8">MATERIALS: REACT 18.3 &#183; VITE &#183; EXPRESS &#183; FIREBASE</text>
    <text x="700" y="410" font-size="20" letter-spacing="1.6" fill="#7f93a8" text-anchor="end">ARCHIVE / FIG. 3</text>
