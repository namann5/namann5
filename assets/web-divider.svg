<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <style type="text/css"><![CDATA[
@keyframes webDraw{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
@keyframes glowPulse{0%,100%{opacity:.3}50%{opacity:.8}}
]]></style>
    <linearGradient id="webGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#E63946" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FF6B6B" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#E63946" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#webGrad)" stroke-width="1"/>
  <g transform="translate(600,30)" opacity="0.5" style="animation:webDraw 3s ease forwards" stroke-dasharray="800">
    <line x1="0" y1="0" x2="-200" y2="-25" stroke="#E63946" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="200" y2="-25" stroke="#E63946" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="-150" y2="20" stroke="#457B9D" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="150" y2="20" stroke="#457B9D" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#E63946" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="0" y2="28" stroke="#457B9D" stroke-width="0.5"/>
    <path d="M0,-10 Q-80,-20 -180,-22" stroke="#E63946" stroke-width="0.4" fill="none"/>
    <path d="M0,-10 Q80,-20 180,-22" stroke="#E63946" stroke-width="0.4" fill="none"/>
    <path d="M0,10 Q-60,18 -140,20" stroke="#457B9D" stroke-width="0.3" fill="none"/>
    <path d="M0,10 Q60,18 140,20" stroke="#457B9D" stroke-width="0.3" fill="none"/>
    <circle cx="0" cy="0" r="3" fill="#E63946" opacity="0.8" style="animation:glowPulse 2s ease-in-out infinite"/>
  </g>
</svg>
