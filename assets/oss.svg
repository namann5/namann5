<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
  <defs>
    <style type="text/css"><![CDATA[
      @keyframes pu { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      @keyframes bl { 0%,55% { opacity:1; } 56%,100% { opacity:0; } }
      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
      text { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
      .m { font-family:'Cascadia Code','SF Mono',Consolas,'Courier New',monospace; }
      .fade { opacity:0; animation:fadeIn .4s ease-out both; }
    ]]></style>
    <linearGradient id="topG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="60%" stop-color="#E63946" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A8DADC"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8DADC"/>
      <stop offset="100%" stop-color="#A8DADC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8DADC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8DADC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8DADC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="4" fill="none"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#A8DADC" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="16" y="16" width="1068" height="608"/>
    </clipPath>
  </defs>
  <rect width="1100" height="640" fill="#070910"/>

  <g>
    <rect x="15" y="15" width="1070" height="610" fill="none" stroke="#E63946" stroke-width="2" opacity="0.05"/>
    <rect x="16" y="16" width="1068" height="608" fill="none" stroke="#1c2233" stroke-width="1.2"/>
    <path d="M30 38 H46 M30 38 V22" stroke="#E63946" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M1070 38 H1054 M1070 38 V22" stroke="#E63946" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M30 622 H46 M30 622 V638" stroke="#E63946" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M1070 622 H1054 M1070 622 V638" stroke="#E63946" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <g clip-path="url(#panelClip)">
    <rect width="1100" height="640" fill="url(#scan)" opacity="0.5"/>
    <rect width="1100" height="3" fill="url(#beamG)" opacity="0.3">
      <animate attributeName="y" values="30;600;30" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="982" y="580" class="m" font-size="150" font-weight="700" fill="#E63946" opacity="0.045">06</text>

  <g class="m">
    <text x="38" y="52" font-size="13" fill="#E63946">[##]</text>
    <text x="70" y="52" font-size="15" letter-spacing="4" fill="#E6EDF3">OPEN SOURCE</text>
    <text x="1040" y="52" text-anchor="end" font-size="10" fill="#8B949E">~/namann5/oss</text>
    <circle cx="1058" cy="48" r="3" fill="#3FB950" style="animation:pu 1.6s ease-in-out infinite"/>
    <text x="1070" y="52" text-anchor="end" font-size="8" fill="#3FB950" letter-spacing="1">OP::ONLINE</text>
  </g>
  <line x1="36" y1="66" x2="1064" y2="66" stroke="url(#topG)" stroke-width="1.4"/>

  <g class="m" style="animation:fadeIn .4s ease-out both">
    <rect x="40" y="84" width="520" height="430" rx="6" fill="#000" opacity="0.35" transform="translate(6,7)"/>
    <rect x="40" y="84" width="520" height="430" rx="6" fill="#0b0e17" stroke="#1c2233"/>
    <rect x="40" y="84" width="520" height="4" rx="2" fill="url(#greenG)"/>
    <rect x="40" y="84" width="520" height="430" rx="6" fill="url(#cardHi)"/>
    <path d="M52 96 H64 M52 96 V84" stroke="#3FB950" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M548 506 H536 M548 506 V518" stroke="#3FB950" stroke-width="1.5" fill="none" opacity="0.8"/>
    <text x="64" y="124" font-size="11" letter-spacing="3" fill="#8B949E">ROLES // <tspan fill="#3FB950">TIMELINE</tspan></text>
    <line x1="96" y1="160" x2="96" y2="460" stroke="#1c2233" stroke-width="1.5"/>
    <g>
      <circle cx="96" cy="180" r="6" fill="#0f1c14" stroke="#3FB950" stroke-width="2"/>
      <circle cx="96" cy="180" r="2.5" fill="#3FB950" style="animation:pu 2s ease-in-out infinite"/>
      <text x="124" y="176" font-size="12" font-weight="600" fill="#E6EDF3">MAINTAINER</text>
      <text x="124" y="194" font-size="9.5" fill="#8B949E">caretaker of active repos,</text>
      <text x="124" y="210" font-size="9.5" fill="#8B949E">reviews and merges PRs.</text>
    </g>
    <g>
      <circle cx="96" cy="290" r="6" fill="#1a0f14" stroke="#E63946" stroke-width="2"/>
      <circle cx="96" cy="290" r="2.5" fill="#FF6B6B" style="animation:pu 2.2s ease-in-out infinite .4s"/>
      <text x="124" y="286" font-size="12" font-weight="600" fill="#E6EDF3">CONTRIBUTOR</text>
      <text x="124" y="304" font-size="9.5" fill="#8B949E">ships features and fixes to</text>
      <text x="124" y="320" font-size="9.5" fill="#8B949E">community projects regularly.</text>
    </g>
    <g>
      <circle cx="96" cy="400" r="6" fill="#0e1422" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="96" cy="400" r="2.5" fill="#3B82F6" style="animation:pu 2.4s ease-in-out infinite .8s"/>
      <text x="124" y="396" font-size="12" font-weight="600" fill="#E6EDF3">ISSUE TRIAGE</text>
      <text x="124" y="414" font-size="9.5" fill="#8B949E">organizes backlogs, writes repros,</text>
      <text x="124" y="430" font-size="9.5" fill="#8B949E">and keeps docs sharp.</text>
    </g>
  </g>

  <g class="m" style="animation:fadeIn .5s ease-out both">
    <rect x="580" y="84" width="480" height="430" rx="6" fill="#000" opacity="0.35" transform="translate(6,7)"/>
    <rect x="580" y="84" width="480" height="430" rx="6" fill="#0b0e17" stroke="#1c2233"/>
    <rect x="580" y="84" width="480" height="4" rx="2" fill="url(#blueG)"/>
    <rect x="580" y="84" width="480" height="430" rx="6" fill="url(#cardHi)"/>
    <path d="M592 96 H604 M592 96 V84" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M1048 506 H1036 M1048 506 V518" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.8"/>
    <text x="604" y="124" font-size="11" letter-spacing="3" fill="#8B949E">STREAM STATS // <tspan fill="#3B82F6">METRICS</tspan></text>

    <text x="604" y="196" font-size="9" fill="#8B949E" letter-spacing="2">PRs MERGED</text>
    <text x="604" y="238" font-size="42" font-weight="700" fill="#3B82F6">128</text>
    <line x1="604" y1="254" x2="772" y2="254" stroke="url(#blueG)" stroke-width="3">
      <animate attributeName="x2" values="604;772;604" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <text x="604" y="286" font-size="9.5" fill="#8B949E">&gt; <tspan fill="#A8DADC">open by default since day one</tspan></text>

    <line x1="604" y1="312" x2="1036" y2="312" stroke="#1c2233" stroke-width="1"/>

    <text x="604" y="344" font-size="9" letter-spacing="2" fill="#8B949E">ACTIVITY WAVE // 12 WEEKS</text>
    <g transform="translate(604,430)">
      <rect x="0" y="-20" width="16" height="0" rx="2" fill="#E63946"><animate attributeName="height" values="0;20;0" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="24" y="-20" width="16" height="0" rx="2" fill="#3B82F6"><animate attributeName="height" values="0;34;0" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="48" y="-20" width="16" height="0" rx="2" fill="#3FB950"><animate attributeName="height" values="0;14;0" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="72" y="-20" width="16" height="0" rx="2" fill="#A8DADC"><animate attributeName="height" values="0;30;0" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="96" y="-20" width="16" height="0" rx="2" fill="#E63946"><animate attributeName="height" values="0;40;0" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="120" y="-20" width="16" height="0" rx="2" fill="#3B82F6"><animate attributeName="height" values="0;18;0" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="144" y="-20" width="16" height="0" rx="2" fill="#3FB950"><animate attributeName="height" values="0;26;0" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="168" y="-20" width="16" height="0" rx="2" fill="#A8DADC"><animate attributeName="height" values="0;36;0" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="192" y="-20" width="16" height="0" rx="2" fill="#E63946"><animate attributeName="height" values="0;22;0" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="216" y="-20" width="16" height="0" rx="2" fill="#3B82F6"><animate attributeName="height" values="0;32;0" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="240" y="-20" width="16" height="0" rx="2" fill="#3FB950"><animate attributeName="height" values="0;44;0" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="264" y="-20" width="16" height="0" rx="2" fill="#A8DADC"><animate attributeName="height" values="0;24;0" dur="1.5s" repeatCount="indefinite"/></rect>
      <line x1="-6" y1="0" x2="430" y2="0" stroke="#1c2233" stroke-width="1"/>
    </g>

    <text x="604" y="474" font-size="9" fill="#484f58">PEAK WEEK <tspan fill="#3FB950">44</tspan> CONTRIBUTIONS &#183; AVERAGE <tspan fill="#A8DADC">26</tspan>/WEEK</text>
  </g>

  <g class="m" style="animation:fadeIn .7s ease-out both">
    <rect x="40" y="534" width="1020" height="60" rx="6" fill="#000" opacity="0.35" transform="translate(4,5)"/>
    <rect x="40" y="534" width="1020" height="60" rx="6" fill="#0b0e17" stroke="#1c2233"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 96 564" to="360 96 564" dur="16s" repeatCount="indefinite"/>
      <circle cx="96" cy="564" r="16" fill="none" stroke="#FFD166" stroke-width="1.2" stroke-dasharray="3 6"/>
    </g>
    <polygon points="96,555 103,564 96,573 89,564" fill="#FFD166" style="animation:pu 2.4s ease-in-out infinite"/>
    <text x="130" y="570" font-size="11" letter-spacing="2" fill="#8B949E">THANKS FOR THE PINGS // <tspan fill="#FFD166">OPEN BY DEFAULT</tspan></text>
    <text x="1030" y="570" text-anchor="end" font-size="9" fill="#484f58">#hacktoberfest #first-pr #oss</text>
  </g>

  <text x="40" y="632" class="m" font-size="8" fill="#484f58">NAM5//OSS</text>
  <text x="1060" y="632" class="m" font-size="8" fill="#484f58" text-anchor="end">STREAMING +∞</text>
</svg>
