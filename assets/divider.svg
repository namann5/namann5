<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 110" width="1100" height="110">
  <defs>
    <style type="text/css"><![CDATA[
      text { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
    ]]></style>
    <linearGradient id="dLineL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF304F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF304F" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="dLineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2196FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2196FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="110" fill="#05060A"/>
  <line x1="60" y1="55" x2="480" y2="55" stroke="url(#dLineL)" stroke-width="1.4"/>
  <line x1="620" y1="55" x2="1040" y2="55" stroke="url(#dLineR)" stroke-width="1.4"/>
  <g opacity="0.6">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-14 0" dur="2.2s" repeatCount="indefinite"/>
      <text x="480" y="60" font-size="8" fill="#FF304F" text-anchor="end" font-family="monospace">-&gt;</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="14 0" dur="2.2s" repeatCount="indefinite"/>
      <text x="620" y="60" font-size="8" fill="#2196FF" font-family="monospace">-&gt;</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 550 55" to="360 550 55" dur="16s" repeatCount="indefinite"/>
    <circle cx="550" cy="55" r="16" fill="none" stroke="#FF304F" stroke-width="1.1" stroke-dasharray="3 6"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 550 55" to="0 550 55" dur="22s" repeatCount="indefinite"/>
    <circle cx="550" cy="55" r="21" fill="none" stroke="#2196FF" stroke-width="0.8" stroke-dasharray="2 10"/>
  </g>
  <polygon points="550,40 566,55 550,70 534,55" fill="#FF304F">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="550,45 560,55 550,65 540,55" fill="#FF8A8A"/>
  <circle cx="550" cy="55" r="3" fill="#63E6FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="550" y="96" text-anchor="middle" fill="#484f58" font-size="8" letter-spacing="2" opacity="0.9">NAM5 // CONTINUUM</text>
</svg>
