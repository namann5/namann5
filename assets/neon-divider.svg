<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="15%" stop-color="#E63946" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF6B6B" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#E63946" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#E63946" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="url(#neonLine)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="600" cy="40" r="4" fill="#E63946" opacity="0.8"/>
  <circle cx="600" cy="40" r="8" fill="#E63946" opacity="0.15"/>
  <circle cx="580" cy="40" r="2" fill="#FF6B6B" opacity="0.5"/>
  <circle cx="620" cy="40" r="2" fill="#FF6B6B" opacity="0.5"/>
</svg>
