    <g stroke="#E63946" stroke-width="1" fill="none" opacity="0.7">
      <line x1="-5" y1="-1" x2="-18" y2="-14" style="animation:legWiggle 3s ease-in-out infinite"/>
      <line x1="-6" y1="2" x2="-20" y2="-6" style="animation:legWiggle 3s ease-in-out infinite .2s"/>
