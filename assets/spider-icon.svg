      <line x1="5" y1="-1" x2="18" y2="-14" style="animation:legWiggle 3s ease-in-out infinite .1s"/>
      <line x1="6" y1="2" x2="20" y2="-6" style="animation:legWiggle 3s ease-in-out infinite .3s"/>
      <line x1="6" y1="6" x2="19" y2="12" style="animation:legWiggle 3s ease-in-out infinite .5s"/>
      <line x1="5" y1="9" x2="16" y2="20" style="animation:legWiggle 3s ease-in-out infinite .7s"/>
