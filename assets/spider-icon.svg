<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <style type="text/css"><![CDATA[
@keyframes legWiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(2deg)}75%{transform:rotate(-2deg)}}
@keyframes eyeGlow{0%,100%{fill:#E63946;opacity:.8}50%{fill:#FF6B6B;opacity:1}}
]]></style>
    <linearGradient id="spiderGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#1D3557"/>
    </linearGradient>
  </defs>
  <g transform="translate(30,32)">
