    </linearGradient>
    <radialGradient id="footGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF304F" stop-opacity="0.18"/><stop offset="100%" stop-color="#FF304F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="4" fill="none"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6DE7FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1100" height="400" fill="#05060A"/>
