    <rect x="264" width="72" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="300" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">PostgreSQL</text>
    <rect x="344" width="38" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="363" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">Docker</text>
    <rect x="390" width="62" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="421" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">FastAPI</text>
    <rect x="460" width="56" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="488" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">Git</text>
    <rect x="524" width="42" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="545" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">AWS</text>
  </g>

  <text x="700" y="280" font-family="'Segoe UI','Inter',sans-serif" font-weight="700" font-size="14" fill="#A78BFA">Stats</text>
  <line x1="700" y1="288" x2="750" y2="288" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(700, 305)">
    <text x="0" dy="0" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="20" fill="#A78BFA">15+ <tspan font-weight="400" font-size="12" fill="#8b949e">Repos</tspan></text>
    <text x="130" dy="0" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="20" fill="#A78BFA">500+ <tspan font-weight="400" font-size="12" fill="#8b949e">Contributions</tspan></text>
    <text x="0" dy="30" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="20" fill="#A78BFA">30+ <tspan font-weight="400" font-size="12" fill="#8b949e">Streak</tspan></text>
    <text x="130" dy="30" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="20" fill="#A78BFA">8+ <tspan font-weight="400" font-size="12" fill="#8b949e">Projects</tspan></text>
  </g>

  <text x="700" y="390" font-family="'Segoe UI','Inter',sans-serif" font-weight="700" font-size="14" fill="#A78BFA">About Me</text>
  <line x1="700" y1="398" x2="785" y2="398" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(700, 418)">
    <text font-family="'Segoe UI',sans-serif" font-size="12" fill="#8b949e">
      <tspan x="0" dy="0">Full-stack developer passionate about building scalable</tspan>
      <tspan x="0" dy="18">backend systems &amp; integrating AI into real-world products.</tspan>
      <tspan x="0" dy="18">Open source enthusiast. Clean code advocate.</tspan>
    </text>
  </g>

  <text x="700" y="490" font-family="serif" font-style="italic" font-size="12" fill="#A78BFA">"With great code comes great responsibility."</text>

  <text x="60" y="360" font-family="'Segoe UI','Inter',sans-serif" font-weight="700" font-size="14" fill="#A78BFA">Recent Activity</text>
  <line x1="60" y1="368" x2="190" y2="368" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(60, 386)">
    <circle cx="6" cy="6" r="4" fill="#A78BFA"/>
    <text x="18" y="10" font-family="'SF Mono',monospace" font-size="11" fill="#8b949e">Pushed 3 commits to main</text>
    <circle cx="6" cy="30" r="4" fill="#4ade80"/>
    <text x="18" y="34" font-family="'SF Mono',monospace" font-size="11" fill="#8b949e">Merged PR #42 &#x2014; Fix auth flow</text>
    <circle cx="6" cy="54" r="4" fill="#C084FC"/>
    <text x="18" y="58" font-family="'SF Mono',monospace" font-size="11" fill="#8b949e">Starred fastapi/fastapi</text>
    <circle cx="6" cy="78" r="4" fill="#6D28D9"/>
    <text x="18" y="82" font-family="'SF Mono',monospace" font-size="11" fill="#8b949e">Opened issue #17 &#x2014; Rate limiter</text>
  </g>

  <g filter="url(#neonGlow)">
    <rect x="340" y="660" width="600" height="48" rx="24" fill="#7C3AED"/>
    <text x="640" y="690" text-anchor="middle" font-family="'Segoe UI','Inter',sans-serif" font-weight="800" font-size="17" fill="#ffffff" letter-spacing="3">KEEP CODING  &#x2022;  KEEP GROWING</text>
  </g>
  <rect x="340" y="660" width="600" height="48" rx="24" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" style="animation:borderGlow 2s ease-in-out infinite"/>
</svg>
