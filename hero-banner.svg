      <text x="640" y="698" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-weight="800" font-size="15" fill="#ffffff" letter-spacing="4">FRIENDLY NEIGHBORHOOD DEVELOPER</text>
