      <circle cx="200" cy="480" r="1" fill="#A8DADC" style="animation:twinkle 1.8s ease-in-out infinite 1s"/>
      <circle cx="680" cy="580" r="1.8" fill="#E63946" style="animation:twinkle 2.6s ease-in-out infinite .3s"/>
      <circle cx="1000" cy="520" r="1.2" fill="#457B9D" style="animation:twinkle 2s ease-in-out infinite .7s"/>
      <circle cx="400" cy="650" r="1.5" fill="#FF6B6B" style="animation:twinkle 3.2s ease-in-out infinite .5s"/>
      <circle cx="900" cy="620" r="1" fill="#A8DADC" style="animation:twinkle 2.4s ease-in-out infinite .9s"/>
    </g>

