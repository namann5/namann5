      <line x1="1100" y1="0" x2="1100" y2="200"/>
      <line x1="1100" y1="0" x2="1280" y2="100"/>
      <line x1="1100" y1="0" x2="1000" y2="120"/>
      <line x1="1100" y1="50" x2="1250" y2="50" stroke-dasharray="4 6"/>
      <line x1="1100" y1="100" x2="1230" y2="100" stroke-dasharray="4 6"/>
      <line x1="1100" y1="150" x2="1200" y2="150" stroke-dasharray="4 6"/>
      <path d="M1100,20 Q1160,40 1200,60" stroke-dasharray="4 6"/>
      <path d="M1100,50 Q1150,70 1190,90" stroke-dasharray="4 6"/>
      <path d="M1100,80 Q1140,95 1170,110" stroke-dasharray="4 6"/>
    </g>

