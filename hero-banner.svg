<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <style type="text/css"><![CDATA[
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes borderGlow{0%,100%{opacity:.3}50%{opacity:.8}}
svg text{font-family:'Segoe UI','Inter',sans-serif}
]]></style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#7C3AED" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="740" fill="url(#bgGrad)"/>

  <circle cx="1200" cy="80" r="200" fill="#7C3AED" opacity="0.08"/>
  <circle cx="80" cy="660" r="160" fill="#A78BFA" opacity="0.10"/>
  <circle cx="640" cy="400" r="300" fill="#C4B5FD" opacity="0.06"/>

  <g opacity="0.5">
    <circle cx="150" cy="120" r="2" fill="#A78BFA" style="animation:twinkle 2s ease-in-out infinite"/>
    <circle cx="350" cy="60" r="1.5" fill="#7C3AED" style="animation:twinkle 2.5s ease-in-out infinite .3s"/>
    <circle cx="550" cy="180" r="2.5" fill="#C4B5FD" style="animation:twinkle 1.8s ease-in-out infinite .6s"/>
    <circle cx="900" cy="100" r="1.8" fill="#A78BFA" style="animation:twinkle 3s ease-in-out infinite .2s"/>
    <circle cx="1100" cy="200" r="2" fill="#7C3AED" style="animation:twinkle 2.2s ease-in-out infinite .5s"/>
    <circle cx="200" cy="500" r="1.5" fill="#C4B5FD" style="animation:twinkle 1.5s ease-in-out infinite .8s"/>
    <circle cx="700" cy="600" r="2" fill="#A78BFA" style="animation:twinkle 2.8s ease-in-out infinite .4s"/>
    <circle cx="1050" cy="550" r="1.8" fill="#7C3AED" style="animation:twinkle 2s ease-in-out infinite 1s"/>
  </g>

  <g opacity="0.6">
    <text x="130" y="115" font-family="serif" font-size="14" fill="#A78BFA" style="animation:twinkle 2.6s ease-in-out infinite">&#x2726;</text>
    <text x="520" y="175" font-family="serif" font-size="16" fill="#C4B5FD" style="animation:twinkle 2s ease-in-out infinite .5s">&#x2726;</text>
    <text x="880" y="95" font-family="serif" font-size="12" fill="#7C3AED" style="animation:twinkle 2.5s ease-in-out infinite 1s">&#x2727;</text>
    <text x="1080" y="195" font-family="serif" font-size="14" fill="#A78BFA" style="animation:twinkle 3s ease-in-out infinite .3s">&#x2726;</text>
    <text x="180" y="495" font-family="serif" font-size="13" fill="#C4B5FD" style="animation:twinkle 1.8s ease-in-out infinite .7s">&#x2727;</text>
    <text x="690" y="595" font-family="serif" font-size="15" fill="#A78BFA" style="animation:twinkle 2.4s ease-in-out infinite 1.2s">&#x2726;</text>
  </g>

  <line x1="50" y1="300" x2="1230" y2="300" stroke="#C4B5FD" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.2"/>

  <text x="60" y="65" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#8b949e">~/terminal</text>
  <g transform="translate(60, 82)">
    <text font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#C084FC">
      <tspan x="0" dy="0">$ <tspan fill="#e6edf3">git status</tspan></tspan>
      <tspan x="0" dy="20" fill="#8b949e">On branch <tspan fill="#A78BFA">main</tspan></tspan>
      <tspan x="0" dy="18" fill="#8b949e">Changes not staged:</tspan>
      <tspan x="14" dy="18" fill="#C084FC">modified:  </tspan><tspan fill="#e6edf3">src/app.ts</tspan>
      <tspan x="14" dy="18" fill="#C084FC">modified:  </tspan><tspan fill="#e6edf3">README.md</tspan>
      <tspan x="0" dy="22" fill="#4ade80">$ <tspan fill="#e6edf3">npm run build</tspan></tspan>
      <tspan x="0" dy="18" fill="#4ade80">&#x2713; Build successful</tspan>
      <tspan x="0" dy="20" fill="#C084FC">$ <tspan fill="#e6edf3">_</tspan></tspan>
    </text>
    <rect x="52" y="134" width="8" height="14" rx="1" fill="#A78BFA" opacity="0.7" style="animation:cursorBlink 1.2s step-end infinite"/>
  </g>

  <text x="700" y="90" text-anchor="middle" font-family="'Segoe UI','Inter',sans-serif" font-weight="800" font-size="42" fill="url(#purpleGrad)">NAMAN SINGH</text>
  <text x="700" y="120" text-anchor="middle" font-family="'Segoe UI','Inter',sans-serif" font-size="14" fill="#8b949e">Backend Developer  &#x2022;  AI Enthusiast  &#x2022;  Open Source Contributor</text>

