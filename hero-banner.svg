      </text>
      <text x="-200" y="24" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e" text-anchor="start">
        <tspan fill="#E63946">&#x25B6;</tspan> OSS Maintainer Role
      </text>
      <text x="0" y="24" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e" text-anchor="start">
        <tspan fill="#457B9D">&#x25B6;</tspan> Backend at Scale
      </text>
      <text x="200" y="24" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e" text-anchor="start">
        <tspan fill="#A8DADC">&#x25B6;</tspan> Ship. Break. Fix. Repeat.
      </text>
