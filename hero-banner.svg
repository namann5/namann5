      <text x="-70" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Commits</text>
      <rect x="15" width="110" height="52" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="0.5" opacity="0.6"/>
      <text x="70" y="24" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="800" font-size="20" fill="#457B9D">30+</text>
      <text x="70" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Day Streak</text>
      <rect x="140" width="110" height="52" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="0.5" opacity="0.6"/>
      <text x="195" y="24" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="800" font-size="20" fill="#457B9D">8+</text>
      <text x="195" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Projects</text>
    </g>

    <text x="640" y="400" font-family="'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="13" fill="#A8DADC" text-anchor="middle" letter-spacing="3">&#x1F3AF; CURRENT OBJECTIVES</text>
    <line x1="540" y1="408" x2="740" y2="408" stroke="#A8DADC" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <g transform="translate(640, 430)">
      <text x="-200" y="0" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e" text-anchor="start">
        <tspan fill="#E63946">&#x25B6;</tspan> System Design Deep Dives
      </text>
      <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e" text-anchor="start">
        <tspan fill="#457B9D">&#x25B6;</tspan> DSA Grind (400+ problems)
      </text>
      <text x="200" y="0" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e" text-anchor="start">
