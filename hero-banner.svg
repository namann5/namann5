      <rect x="176" width="50" height="22" rx="11" fill="none" stroke="#E63946" stroke-width="0.8" opacity="0.6"/>
      <text x="201" y="15" text-anchor="middle" font-family="'SF Mono',monospace" font-size="9" fill="#FF6B6B">MongoDB</text>
      <rect x="232" width="42" height="22" rx="11" fill="none" stroke="#457B9D" stroke-width="0.8" opacity="0.6"/>
      <text x="253" y="15" text-anchor="middle" font-family="'SF Mono',monospace" font-size="9" fill="#A8DADC">Redis</text>
    </g>

    <text x="640" y="268" font-family="'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="13" fill="#457B9D" text-anchor="middle" letter-spacing="3">&#x1F4CA; POWER LEVEL</text>
    <line x1="560" y1="276" x2="720" y2="276" stroke="#457B9D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <g transform="translate(640, 300)">
