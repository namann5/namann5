<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <style type="text/css"><![CDATA[
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:.9;transform:scale(1)}}
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes borderGlow{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes rainFall{0%{transform:translateY(-20px);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(760px);opacity:0}}
@keyframes webDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
svg text{font-family:'Segoe UI','Inter',system-ui,sans-serif}
]]></style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D3557"/>
      <stop offset="100%" stop-color="#457B9D"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="600" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#457B9D"/>
    </linearGradient>
    <filter id="neonRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#E63946" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bannerClip"><rect width="1280" height="740" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="1280" height="740" fill="url(#bgGrad)"/>

    <circle cx="1150" cy="100" r="250" fill="#E63946" opacity="0.04"/>
    <circle cx="130" cy="640" r="200" fill="#457B9D" opacity="0.05"/>
    <circle cx="640" cy="370" r="350" fill="#1D3557" opacity="0.04"/>

    <g opacity="0.4">
      <circle cx="120" cy="90" r="1.5" fill="#E63946" style="animation:twinkle 2.5s ease-in-out infinite"/>
      <circle cx="310" cy="45" r="1" fill="#457B9D" style="animation:twinkle 3s ease-in-out infinite .4s"/>
      <circle cx="500" cy="150" r="2" fill="#FF6B6B" style="animation:twinkle 2s ease-in-out infinite .8s"/>
      <circle cx="820" cy="70" r="1.2" fill="#E63946" style="animation:twinkle 2.8s ease-in-out infinite .2s"/>
