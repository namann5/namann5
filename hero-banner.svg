    </g>

    <text x="55" y="58" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" fill="#8b949e" opacity="0.7">~/naman</text>
    <g transform="translate(55, 72)">
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11.5">
        <tspan fill="#E63946">$</tspan><tspan dx="6" fill="#e6edf3">git log --oneline -1</tspan>
        <tspan x="0" dy="19" fill="#8b949e">d573ff1</tspan><tspan dx="6" fill="#e6edf3">fix: always shipping</tspan>
        <tspan x="0" dy="19" fill="#E63946">$</tspan><tspan dx="6" fill="#e6edf3">echo $STATUS</tspan>
        <tspan x="0" dy="19" fill="#4ade80">Building. Learning. Never stopping.</tspan>
        <tspan x="0" dy="22" fill="#E63946">$</tspan><tspan dx="6" fill="#e6edf3">_</tspan>
      </text>
      <rect x="30" y="114" width="7" height="13" rx="1" fill="#E63946" opacity="0.8" style="animation:cursorBlink 1.1s step-end infinite"/>
    </g>

    <g transform="translate(55, 230)">
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" fill="#8b949e" opacity="0.6">
        <tspan fill="#E63946">1</tspan><tspan dx="10" fill="#C084FC">import</tspan><tspan fill="#e6edf3"> {'{ '}</tspan><tspan fill="#457B9D">skills</tspan><tspan fill="#e6edf3">{' }'} </tspan><tspan fill="#C084FC">from</tspan><tspan fill="#4ade80"> 'naman'</tspan><tspan fill="#e6edf3">;</tspan>
        <tspan x="0" dy="16" fill="#8b949e">2</tspan><tspan dx="10" fill="#C084FC">const</tspan><tspan fill="#e6edf3"> mission = </tspan><tspan fill="#C084FC">await</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#457B9D">buildFuture</tspan><tspan fill="#e6edf3">();</tspan>
        <tspan x="0" dy="16" fill="#8b949e">3</tspan>
        <tspan x="0" dy="16" fill="#8b949e">4</tspan><tspan dx="10" fill="#C084FC">interface</tspan><tspan fill="#457B9D"> Dev</tspan><tspan fill="#e6edf3"> {'{'}</tspan>
        <tspan x="12" dy="16" fill="#8b949e">5</tspan><tspan dx="10" fill="#e6edf3">name: </tspan><tspan fill="#4ade80">string</tspan><tspan fill="#e6edf3">;</tspan>
        <tspan x="12" dy="16" fill="#8b949e">6</tspan><tspan dx="10" fill="#e6edf3">role: </tspan><tspan fill="#4ade80">"friendly neighborhood"</tspan><tspan fill="#e6edf3">;</tspan>
        <tspan x="0" dy="16" fill="#8b949e">7</tspan><tspan dx="10" fill="#e6edf3">{'}'}</tspan>
      </text>
    </g>

    <text x="640" y="82" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="44" fill="url(#nameGrad)" letter-spacing="2">NAMAN SINGH</text>

