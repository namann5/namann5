      <line x1="200" y1="0" x2="230" y2="740" stroke="#457B9D" stroke-width="0.3"/>
      <line x1="500" y1="0" x2="530" y2="740" stroke="#E63946" stroke-width="0.3"/>
      <line x1="800" y1="0" x2="830" y2="740" stroke="#457B9D" stroke-width="0.3"/>
      <line x1="1100" y1="0" x2="1130" y2="740" stroke="#E63946" stroke-width="0.5"/>
