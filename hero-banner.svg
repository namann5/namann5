    <text x="36" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">TypeScript</text>
    <rect x="80" width="52" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="106" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">Node.js</text>
    <rect x="140" width="50" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
    <text x="165" y="16" text-anchor="middle" font-family="'SF Mono',monospace" font-size="10" fill="#C4B5FD">React</text>
    <rect x="198" width="58" height="24" rx="12" fill="#1c1528" stroke="#7C3AED" stroke-width="0.5"/>
