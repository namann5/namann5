        <tspan fill="#E63946">&#x25CF;</tspan> FULL STACK DEVELOPER <tspan fill="#457B9D">&#x25CF;</tspan> AI ENTHUSIAST <tspan fill="#A8DADC">&#x25CF;</tspan> OPEN SOURCE
      </text>
    </g>

