      <text x="-195" y="24" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="800" font-size="20" fill="#E63946">15+</text>
      <text x="-195" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Repos</text>
      <rect x="-125" width="110" height="52" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="0.5" opacity="0.6"/>
