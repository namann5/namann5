      <circle cx="5" cy="27" r="3" fill="#457B9D"/>
      <text x="16" y="31" font-family="'SF Mono',monospace" font-size="10.5" fill="#8b949e">Merged PR #42 &#x2014; Fix auth flow</text>
      <circle cx="5" cy="49" r="3" fill="#A8DADC"/>
      <text x="16" y="53" font-family="'SF Mono',monospace" font-size="10.5" fill="#8b949e">Starred fastapi/fastapi</text>
      <circle cx="5" cy="71" r="3" fill="#E63946"/>
      <text x="16" y="75" font-family="'SF Mono',monospace" font-size="10.5" fill="#8b949e">Opened issue &#x2014; Rate limiter bug</text>
